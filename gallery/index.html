<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery — geller.ee</title>
    <meta name="description" content="A photo gallery on geller.ee, with a click-to-open lightbox viewer.">
    <link rel="canonical" href="https://geller.ee/gallery/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="manifest" href="/manifest.json">
    <script>(function(){var t=localStorage.getItem("theme");if(!t)t=window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;}());</script>
</head>
<body>
    <div id="navbar-container"></div>
    <main>
        <!-- To add images: copy a .gallery-item block, set the src to /assets/images/yourfile.jpg,
             and write an alt that describes what is in the photo (the lightbox reuses it) -->
        <!-- To add a new category: copy a <section> block and change the <h2> heading -->
        <section>
            <h2>uncategorized</h2>
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="/assets/images/example.jpg" alt="Placeholder gallery image" onclick="openLightbox(this)">
                </div>
            </div>
        </section>
    </main>

    <div id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <button id="scroll-top-btn" aria-label="Scroll to top">↑</button>
    <script src="/assets/js/pages/gallery.js"></script>
    <script src="/assets/js/lib/navbar-loader.js"></script>
    <script src="/assets/js/lib/theme.js"></script>
    <script src="/assets/js/lib/nav-scroll.js"></script>
    <script src="/assets/js/lib/command-palette.js"></script>
    <script src="/assets/js/lib/scroll-top.js"></script>
    <script src="/assets/js/lib/keyboard-nav.js"></script>
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
