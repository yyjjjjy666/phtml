<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wheel — geller.ee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="manifest" href="/manifest.json">
    <script>(function(){var t=localStorage.getItem("theme");if(!t)t=window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;}());</script>
</head>
<body>
    <div id="navbar-container"></div>
    <main>
        <div class="tool-panel">
            <div class="tool-panel-header">fortune wheel</div>
            <div id="wheel-page">
                <div id="wheel-container">
                    <canvas id="wheel-canvas" width="400" height="400"></canvas>
                </div>
                <div id="wheel-controls">
                    <div id="item-input-section">
                        <div id="item-input-row">
                            <input id="item-input" type="text" placeholder="add item..." maxlength="40">
                            <input id="weight-input" type="number" min="1" max="99" value="1" title="weight (1-99)">
                            <button id="add-btn">add</button>
                        </div>
                        <p id="wheel-msg"></p>
                    </div>

                    <div id="item-list-section">
                        <div id="list-header">
                            <h3>Items (<span id="item-count">0</span>/30)</h3>
                            <div id="list-controls">
                                <select id="preset-select">
                                    <option value="">Load Preset...</option>
                                    <option value="yes-no">Yes / No</option>
                                    <option value="truth-dare">Truth or Dare</option>
                                    <option value="eat">What to eat?</option>
                                    <option value="movie">Movie night</option>
                                </select>
                                <button id="clear-btn">Clear All</button>
                            </div>
                        </div>
                        <ul id="item-list"></ul>
                    </div>

                    <div id="spin-section">
                        <div id="spin-controls">
                            <div id="duration-control">
                                <label for="duration-input">Duration: <span id="duration-display">5</span>s</label>
                                <input id="duration-input" type="range" min="1" max="60" value="5">
                            </div>
                            <div id="spin-buttons">
                                <button id="spin-btn" class="spin-button">🎯 Spin!</button>
                                <button id="sound-toggle" class="sound-toggle" title="Toggle sound">🔊</button>
                            </div>
                        </div>
                        <div id="result-section">
                            <p id="result"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <button id="scroll-top-btn" aria-label="Scroll to top">↑</button>
    <script src="/assets/js/lib/navbar-loader.js"></script>
    <script src="/assets/js/pages/wheel.js"></script>
    <script src="/assets/js/lib/theme.js"></script>
    <script src="/assets/js/lib/nav-scroll.js"></script>
    <script src="/assets/js/lib/command-palette.js"></script>
    <script src="/assets/js/lib/scroll-top.js"></script>
    <script src="/assets/js/lib/keyboard-nav.js"></script>
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
