<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact — geller.ee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="manifest" href="/manifest.json">

    <link rel="icon" href="/favicon.ico" sizes="32x32">

    <script>(function(){var t=localStorage.getItem("theme");if(!t)t=window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;}());</script>
</head>
<body>
    <div id="navbar-container"></div>
    <main>
        <div class="tool-panel" style="max-width:520px;margin:var(--sp-10) auto;">

                <div class="contact-tile contact-tile--disabled">

                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <div class="contact-tile-text">
                        <span class="contact-tile-name">pgp key</span>
                        <span class="contact-tile-sub">coming soon — email contact available once pgp is set up</span>
                    </div>
                </div>

            </div>
        </div>

    <button id="scroll-top-btn" aria-label="Scroll to top">↑</button>

    <script src="/assets/js/lib/theme.js"></script>
    <script src="/assets/js/lib/nav-scroll.js"></script>
